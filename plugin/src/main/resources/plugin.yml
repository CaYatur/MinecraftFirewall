name: MinecraftFirewallBridge
main: dev.cayadev.mcfirewall.bridge.FirewallBridgePlugin
version: 1.7.3
api-version: "1.13"
author: MinecraftFirewall
description: Optional server-side half of MinecraftFirewall. Protects players held at the login prompt, and makes the login commands real ones.
website: https://github.com/CaYatur/MinecraftFirewall

# Declared so the client renders them as real commands and /help lists them. MinecraftFirewall
# answers all three before the server ever sees them, so the executors do nothing -- see the comment
# on onCommand. Without these, the commands are painted red in the chat box and appear nowhere in
# help, which makes a working login look broken.
commands:
  login:
    description: Log in to this server.
    usage: /login <password>
  register:
    description: Create an account on this server.
    usage: /register <password>
  premium:
    description: Lock this name to your real Minecraft account, so it never needs a password.
    usage: /premium [confirm]
